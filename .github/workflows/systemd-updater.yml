name: Systemd updater

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - VERSION
      - update.sh
      - ops/update_systemd.sh
      - ops/publish_frontend.sh
      - ops/systemd/**
      - docs/SYSTEMD_DEPLOYMENT.md
      - docs/INSTALLATION.md
      - docs/TROUBLESHOOTING.md
      - docs/SYSTEM_REQUIREMENTS.md
      - docs/PRODUCTION_DEPLOYMENT.md
      - docs/README.md
      - .github/workflows/systemd-updater.yml
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify updater entrypoints are executable
        run: |
          test -x update.sh
          test -x ops/update_systemd.sh
      - name: Validate updater shell syntax
        run: |
          bash -n update.sh
          bash -n ops/update_systemd.sh
          bash -n ops/publish_frontend.sh
      - name: Verify deployment contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PYTHON_BIN="${PYTHON_BIN:-python3.12}"' ops/update_systemd.sh
          grep -F 'HEALTH_URL="${HEALTH_URL:-http://127.0.0.1:9001/health/ready}"' ops/update_systemd.sh
          grep -F 'merge --ff-only' ops/update_systemd.sh
          grep -F 'npm ci' ops/update_systemd.sh
          grep -F 'venv.release.$STAMP' ops/update_systemd.sh
          grep -F 'ln -s "$NEW_VENV" "$VENV_DIR"' ops/update_systemd.sh
          grep -F 'cd "$BACKEND_DIR"' ops/update_systemd.sh
          grep -F 'PYTHONPATH=. "$VENV_DIR/bin/python" -c' ops/update_systemd.sh
          grep -F '"$VENV_DIR/bin/python" -m celery -A celery_app:celery_app report' ops/update_systemd.sh
          grep -F '"$VENV_DIR/bin/python" -m celery -A celery_app:celery_app inspect ping --timeout=5' ops/update_systemd.sh
          grep -F 'systemctl enable wb-backend wb-celery wb-celery-beat' ops/update_systemd.sh
          grep -F -- '/venv/bin/python -m celery -A celery_app:celery_app worker' ops/systemd/wb-celery.service.d/10-wb-insight.conf
          grep -F -- '/venv/bin/python -m celery -A celery_app:celery_app beat' ops/systemd/wb-celery-beat.service.d/10-wb-insight.conf
          grep -F 'bootstrap_latest_updater' update.sh
          grep -F 'exec env WB_UPDATE_REEXEC=1' update.sh
          grep -F 'bash "$PROJECT_DIR/ops/publish_frontend.sh"' update.sh
          grep -F 'nginx -T' ops/publish_frontend.sh
          grep -F 'BACKEND_UPSTREAM="${BACKEND_UPSTREAM:-127.0.0.1:9001}"' ops/publish_frontend.sh
          grep -F 'FRONTEND_DEPLOY_DIR="${FRONTEND_DEPLOY_DIR:-}"' ops/publish_frontend.sh
          grep -F 'cmp -s "$BUILD_DIR/index.html" "$DEPLOY_DIR/index.html"' ops/publish_frontend.sh
          if grep -Fq 'mv "$NEW_VENV" "$VENV_DIR"' ops/update_systemd.sh; then
            echo 'release venv must not be renamed after pip install' >&2
            exit 1
          fi
          grep -F 'Python **3.12**' docs/SYSTEMD_DEPLOYMENT.md
