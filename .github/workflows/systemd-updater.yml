name: Systemd updater

on:
  pull_request:
    paths:
      - ops/update_systemd.sh
      - docs/SYSTEMD_DEPLOYMENT.md
      - docs/INSTALLATION.md
      - docs/TROUBLESHOOTING.md
      - docs/SYSTEM_REQUIREMENTS.md
      - docs/PRODUCTION_DEPLOYMENT.md
      - docs/README.md
      - .github/workflows/systemd-updater.yml
  push:
    branches: [main]
    paths:
      - ops/update_systemd.sh
      - docs/SYSTEMD_DEPLOYMENT.md
      - docs/INSTALLATION.md
      - docs/TROUBLESHOOTING.md
      - docs/SYSTEM_REQUIREMENTS.md
      - docs/PRODUCTION_DEPLOYMENT.md
      - docs/README.md
      - .github/workflows/systemd-updater.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify updater is executable
        run: test -x ops/update_systemd.sh
      - name: Validate updater shell syntax
        run: bash -n ops/update_systemd.sh
      - name: Execute updater runtime preflight
        env:
          PROJECT_DIR: ${{ github.workspace }}
          PYTHON_BIN: python3.12
        run: ./ops/update_systemd.sh --preflight-only
      - name: Verify required deployment guards are present
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PYTHON_BIN="${PYTHON_BIN:-python3.12}"' ops/update_systemd.sh
          grep -F 'merge --ff-only' ops/update_systemd.sh
          grep -F 'npm ci' ops/update_systemd.sh
          grep -F 'health/ready' ops/update_systemd.sh
          grep -F 'venv.release.$STAMP' ops/update_systemd.sh
          grep -F 'ln -s "$NEW_VENV" "$VENV_DIR"' ops/update_systemd.sh
          grep -F '"$VENV_DIR/bin/celery" --version' ops/update_systemd.sh
          if grep -Fq 'mv "$NEW_VENV" "$VENV_DIR"' ops/update_systemd.sh; then
            echo 'release venv must not be renamed after pip install' >&2
            exit 1
          fi
          grep -F 'Python **3.12**' docs/SYSTEMD_DEPLOYMENT.md
