name: Systemd updater

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - VERSION
      - update.sh
      - ops/update_systemd.sh
      - ops/publish_frontend.sh
      - ops/postgres_backup.sh
      - ops/postgres_restore.sh
      - ops/updater_transaction_contract.py
      - ops/systemd/**
      - docs/SYSTEMD_DEPLOYMENT.md
      - docs/INSTALLATION.md
      - docs/TROUBLESHOOTING.md
      - docs/SYSTEM_REQUIREMENTS.md
      - docs/PRODUCTION_DEPLOYMENT.md
      - docs/README.md
      - .github/workflows/systemd-updater.yml
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Проверить executable entrypoint обновления
        run: |
          test -x update.sh
          test -x ops/update_systemd.sh
      - name: Проверить синтаксис shell-скриптов
        run: |
          bash -n update.sh
          bash -n ops/update_systemd.sh
          bash -n ops/publish_frontend.sh
          bash -n ops/postgres_backup.sh
          bash -n ops/postgres_restore.sh
      - name: Проверить транзакционный контракт обновлятора
        run: python ops/updater_transaction_contract.py
      - name: Проверить базовый deployment-контракт
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PYTHON_BIN="${PYTHON_BIN:-python3.12}"' ops/update_systemd.sh
          grep -F 'HEALTH_URL="${HEALTH_URL:-http://127.0.0.1:9001/health/ready}"' ops/update_systemd.sh
          grep -F 'venv.release.$STAMP' ops/update_systemd.sh
          grep -F 'ln -s "$NEW_VENV" "$VENV_DIR"' ops/update_systemd.sh
          grep -F 'systemctl stop wb-backend wb-celery wb-celery-beat' ops/update_systemd.sh
          grep -F 'systemctl restart wb-backend wb-celery wb-celery-beat' ops/update_systemd.sh
          grep -F 'FRONTEND_BUILD_DIR="$CANDIDATE_FRONTEND/dist"' ops/update_systemd.sh
          grep -F 'RESTORE_CONFIRM=YES' ops/update_systemd.sh
          grep -F 'flock -n 9' update.sh
          grep -F 'git -C "$PROJECT_DIR" show "$target_commit:ops/update_systemd.sh"' update.sh
          grep -F 'nginx -T' ops/publish_frontend.sh
          grep -F 'BACKEND_UPSTREAM="${BACKEND_UPSTREAM:-127.0.0.1:9001}"' ops/publish_frontend.sh
          grep -F 'FRONTEND_DEPLOY_DIR="${FRONTEND_DEPLOY_DIR:-}"' ops/publish_frontend.sh
          grep -F 'cmp -s "$BUILD_DIR/index.html" "$DEPLOY_DIR/index.html"' ops/publish_frontend.sh
          if grep -Fq 'mv "$NEW_VENV" "$VENV_DIR"' ops/update_systemd.sh; then
            echo 'Release-venv запрещено переименовывать после установки зависимостей.' >&2
            exit 1
          fi
          grep -F 'Python **3.12**' docs/SYSTEMD_DEPLOYMENT.md
      - name: Проверить self-test deployment acceptance
        run: python ops/systemd_acceptance.py --self-test
