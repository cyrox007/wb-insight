name: Backend security

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'VERSION'
      - 'backend/**'
      - '.github/workflows/backend-security.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'VERSION'
      - 'backend/**'
      - '.github/workflows/backend-security.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Audit backend dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Run backend tests
        env:
          APP_ENV: development
          JWT_SECRET_KEY: ci-only-test-key
          API_TOKEN_ENCRYPTION_KEY: ci-only-token-encryption-key
          ALLOW_FAKE_BILLING: 'false'
          PYTHONPATH: .
        run: pytest -q tests
