name: Release integrity

on:
  pull_request:
    paths:
      - VERSION
      - CHANGELOG.md
      - backend/app.py
      - backend/settings.py
      - backend/core/production_config.py
      - backend/core/lifecycle_config.py
      - backend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/Dockerfile
      - frontend/nginx.conf
      - compose.production.yml
      - .env.production.example
      - .dockerignore
      - ops/**
      - docs/OPERATIONS.md
      - docs/RELEASE_SMOKE.md
      - docs/RELEASE_EVIDENCE.md
      - docs/DATA_ACCURACY_ACCEPTANCE.md
      - docs/RELEASE_ROADMAP.md
      - docs/VERSIONING.md
      - docs/VERSION_HISTORY.md
      - docs/RELEASE_READINESS.md
      - .github/workflows/release-integrity.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - backend/app.py
      - backend/settings.py
      - backend/core/production_config.py
      - backend/core/lifecycle_config.py
      - backend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/Dockerfile
      - frontend/nginx.conf
      - compose.production.yml
      - .env.production.example
      - .dockerignore
      - ops/**
      - docs/OPERATIONS.md
      - docs/RELEASE_SMOKE.md
      - docs/RELEASE_EVIDENCE.md
      - docs/DATA_ACCURACY_ACCEPTANCE.md
      - docs/RELEASE_ROADMAP.md
      - docs/VERSIONING.md
      - docs/VERSION_HISTORY.md
      - docs/RELEASE_READINESS.md
      - .github/workflows/release-integrity.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical version metadata
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < VERSION)"
          frontend="$(node -p "require('./frontend/package.json').version")"
          test "$expected" = "$frontend"
          grep -F "## [$expected]" CHANGELOG.md
      - name: Validate release smoke runner
        run: |
          python3 -m py_compile ops/release_smoke.py
          python3 ops/release_smoke.py --help >/dev/null

  acceptance-tools:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Validate acceptance tools syntax
        run: |
          python3 -m py_compile \
            ops/acceptance/data_accuracy.py \
            ops/data_accuracy_acceptance.py \
            ops/release_evidence.py
          python3 ops/data_accuracy_acceptance.py --help >/dev/null
          python3 ops/release_evidence.py --help >/dev/null
      - name: Verify data accuracy completeness and tolerance contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/data_accuracy_acceptance.py \
            --input ops/acceptance/fixtures/passing.json \
            --output-json /tmp/data-accuracy.json \
            --output-md /tmp/data-accuracy.md
          grep -F '"status": "pass"' /tmp/data-accuracy.json
          grep -F '"required_metric_count": 21' /tmp/data-accuracy.json
          grep -F '"missing": 0' /tmp/data-accuracy.json
          test -s /tmp/data-accuracy.md

          if python3 ops/data_accuracy_acceptance.py \
            --input ops/acceptance/fixtures/failing.json \
            --output-json /tmp/data-accuracy-failing.json; then
            echo 'Failing acceptance fixture unexpectedly passed' >&2
            exit 1
          fi
          grep -F '"status": "fail"' /tmp/data-accuracy-failing.json
          grep -E '"fail": [1-9][0-9]*' /tmp/data-accuracy-failing.json

          if python3 ops/data_accuracy_acceptance.py \
            --input ops/acceptance/fixtures/incomplete.json \
            --output-json /tmp/data-accuracy-incomplete.json; then
            echo 'Incomplete required-metric fixture unexpectedly passed' >&2
            exit 1
          fi
          grep -F '"status": "fail"' /tmp/data-accuracy-incomplete.json
          grep -F '"missing": 17' /tmp/data-accuracy-incomplete.json

          PYTHONPATH=ops python3 - <<'PY'
          from acceptance.data_accuracy import AcceptanceError, evaluate_metric

          required_policy = {
              "required": True,
              "unit": "RUB",
              "category": "finance",
              "tolerance_mode": "absolute",
              "absolute_tolerance": "0.02",
          }

          try:
              evaluate_metric(
                  {
                      "metric": "revenue",
                      "source": "fixture",
                      "required": False,
                      "expected": "100.00",
                      "actual": "100.00",
                  },
                  required_policy,
              )
          except AcceptanceError as exc:
              assert "cannot disable" in str(exc)
          else:
              raise SystemExit("policy-required metric downgrade unexpectedly succeeded")

          try:
              evaluate_metric(
                  {
                      "metric": "revenue",
                      "source": "fixture",
                      "expected": "100.00",
                      "actual": "100.50",
                      "absolute_tolerance": "1.00",
                  },
                  required_policy,
              )
          except AcceptanceError as exc:
              assert "override_reason" in str(exc)
          else:
              raise SystemExit("unexplained tolerance override unexpectedly succeeded")

          row = evaluate_metric(
              {
                  "metric": "revenue",
                  "source": "fixture",
                  "expected": "100.00",
                  "actual": "100.50",
                  "absolute_tolerance": "1.00",
                  "override_reason": "approved reconciliation difference",
              },
              required_policy,
          )
          assert row["status"] == "pass"
          assert row["override_reason"] == "approved reconciliation difference"
          assert row["absolute_tolerance"] == "1"
          PY
      - name: Verify beta evidence manifest contract
        shell: bash
        run: |
          set -euo pipefail
          release_sha="0123456789abcdef0123456789abcdef01234567"
          printf '%s\n' '0.9.0-beta.1' > /tmp/VERSION-beta
          printf '%s\n' 'ci-green-exact-head' > /tmp/ci.txt
          printf '%s\n' 'production-like-deploy-and-rollback-green' > /tmp/deployment.txt
          printf '%s\n' 'core-smoke-green' > /tmp/core-smoke.txt
          printf '%s\n' 'smtp-recovery-and-account-lifecycle-green' > /tmp/account-lifecycle.txt
          printf '%s\n' 'desktop-mobile-ux-smoke-green' > /tmp/ux-smoke.txt
          printf '%s\n' 'frontend-git-log-secrets-review-green' > /tmp/secrets-review.txt
          cp /tmp/data-accuracy.json /tmp/data-accuracy-evidence.json

          complete_args=(
            --stage beta
            --environment staging-ci-fixture
            --commit "$release_sha"
            --version-file /tmp/VERSION-beta
            --artifact ci=/tmp/ci.txt
            --artifact deployment=/tmp/deployment.txt
            --artifact core_smoke=/tmp/core-smoke.txt
            --artifact account_lifecycle=/tmp/account-lifecycle.txt
            --artifact ux_smoke=/tmp/ux-smoke.txt
            --artifact secrets_review=/tmp/secrets-review.txt
            --artifact data_accuracy=/tmp/data-accuracy-evidence.json
          )

          python3 ops/release_evidence.py \
            "${complete_args[@]}" \
            --output /tmp/release-evidence.json
          grep -F '"schema_version": 2' /tmp/release-evidence.json
          grep -F '"status": "complete"' /tmp/release-evidence.json
          grep -F '"account_lifecycle"' /tmp/release-evidence.json
          grep -F '"deployment"' /tmp/release-evidence.json
          grep -F '"ux_smoke"' /tmp/release-evidence.json
          grep -F '"secrets_review"' /tmp/release-evidence.json

          if python3 ops/release_evidence.py \
            --stage beta \
            --environment staging-ci-fixture \
            --commit "$release_sha" \
            --version-file /tmp/VERSION-beta \
            --artifact ci=/tmp/ci.txt \
            --artifact core_smoke=/tmp/core-smoke.txt \
            --artifact data_accuracy=/tmp/data-accuracy-evidence.json \
            --output /tmp/release-evidence-incomplete.json; then
            echo 'Incomplete beta evidence unexpectedly passed' >&2
            exit 1
          fi
          grep -F '"status": "incomplete"' /tmp/release-evidence-incomplete.json
          grep -F '"deployment"' /tmp/release-evidence-incomplete.json
          grep -F '"account_lifecycle"' /tmp/release-evidence-incomplete.json
          grep -F '"ux_smoke"' /tmp/release-evidence-incomplete.json
          grep -F '"secrets_review"' /tmp/release-evidence-incomplete.json

          if python3 ops/release_evidence.py \
            --stage beta \
            --environment staging-ci-fixture \
            --commit ci-fixture-sha \
            --version-file /tmp/VERSION-beta \
            --artifact ci=/tmp/ci.txt; then
            echo 'Invalid commit unexpectedly passed release evidence validation' >&2
            exit 1
          fi

          if python3 ops/release_evidence.py \
            --stage beta \
            --environment staging-ci-fixture \
            --commit "$release_sha" \
            --version-file VERSION \
            --artifact ci=/tmp/ci.txt; then
            echo 'Alpha VERSION unexpectedly accepted for beta evidence' >&2
            exit 1
          fi

          : > /tmp/empty.txt
          if python3 ops/release_evidence.py \
            --stage beta \
            --environment staging-ci-fixture \
            --commit "$release_sha" \
            --version-file /tmp/VERSION-beta \
            --artifact ci=/tmp/empty.txt; then
            echo 'Empty evidence artifact unexpectedly passed validation' >&2
            exit 1
          fi

          if python3 ops/release_evidence.py \
            --stage beta \
            --environment staging-ci-fixture \
            --commit "$release_sha" \
            --version-file /tmp/VERSION-beta \
            --artifact ci=/tmp/ci.txt \
            --artifact deployment=/tmp/deployment.txt \
            --artifact core_smoke=/tmp/core-smoke.txt \
            --artifact account_lifecycle=/tmp/account-lifecycle.txt \
            --artifact ux_smoke=/tmp/ux-smoke.txt \
            --artifact secrets_review=/tmp/secrets-review.txt \
            --artifact data_accuracy=/tmp/data-accuracy-failing.json; then
            echo 'Failing data-accuracy evidence unexpectedly passed manifest validation' >&2
            exit 1
          fi

  docker-build:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t wb-insight-backend:ci .
      - name: Verify fail-closed production configuration
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm --env-file .env.production.example \
            wb-insight-backend:ci python -c 'import settings'; then
            echo 'Unmodified production example unexpectedly passed startup validation' >&2
            exit 1
          fi

          docker run --rm --env-file .env.production.example \
            -e SERVER_ADDR=ci.wbinsight.local \
            -e ALLOWED_ORIGINS=https://ci.wbinsight.local \
            -e DB_PASSWORD=ci-only-db-password-not-production \
            -e JWT_SECRET_KEY=ci-only-jwt-secret-key-not-production-1234567890 \
            -e LEGAL_EVIDENCE_HMAC_KEY=ci-only-legal-evidence-hmac-key-1234567890 \
            -e API_TOKEN_ENCRYPTION_KEY=2A3k6qmH-9j-jppiuX-2xFvrNEeLp3aKjbIy2Verwxc= \
            -e WB_SERVICE_ID=ci-service-id \
            -e WB_SERVICE_SECRET=ci-only-wb-service-secret \
            wb-insight-backend:ci python -c 'import app; print("production_config=ok")' \
            | grep -F 'production_config=ok'
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t wb-insight-frontend:ci .
      - name: Validate Compose model
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.production.yml config >/dev/null
      - name: Smoke same-origin gateway routing
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f wb-ci-frontend wb-ci-backend >/dev/null 2>&1 || true
            docker network rm wb-ci-network >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create wb-ci-network >/dev/null
          docker run -d --name wb-ci-backend --network wb-ci-network --network-alias backend python:3.12-alpine \
            python -u -c 'from http.server import BaseHTTPRequestHandler,HTTPServer; H=type("H",(BaseHTTPRequestHandler,),{"do_GET":lambda s:(s.send_response(200),s.end_headers(),s.wfile.write(("backend:"+s.path).encode())),"do_POST":lambda s:(s.send_response(200),s.end_headers(),s.wfile.write(("backend:"+s.path).encode())),"log_message":lambda *a:None}); HTTPServer(("0.0.0.0",9000),H).serve_forever()' >/dev/null
          docker run -d --name wb-ci-frontend --network wb-ci-network -p 18080:8080 wb-insight-frontend:ci >/dev/null

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/tmp/wb-ci-index.html; then
              break
            fi
            sleep 1
          done
          grep -F '<div id="app"></div>' /tmp/wb-ci-index.html

          gateway_ready=false
          for attempt in $(seq 1 30); do
            body="$(curl -fsS http://127.0.0.1:18080/health/live 2>/dev/null || true)"
            if test "$body" = 'backend:/health/live'; then
              gateway_ready=true
              break
            fi
            sleep 1
          done
          if test "$gateway_ready" != true; then
            echo 'Backend mock did not become reachable through nginx gateway' >&2
            docker logs wb-ci-backend >&2 || true
            docker logs wb-ci-frontend >&2 || true
            exit 1
          fi

          for route in health/live auth/refresh account/deactivate billing/sber/callback legal/documents/terms dashboard/ control-panel/operations/health; do
            body="$(curl -fsS "http://127.0.0.1:18080/${route}")"
            test "$body" = "backend:/${route}"
          done

          # The production Vue build defaults to /api. Verify Docker nginx strips
          # that public prefix before forwarding to the FastAPI root.
          for route in health/live auth/refresh account/deactivate billing/sber/callback legal/documents/terms dashboard/ control-panel/operations/health; do
            body="$(curl -fsS "http://127.0.0.1:18080/api/${route}")"
            test "$body" = "backend:/${route}"
          done

  backup-restore:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbops
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wbops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 55433
      DB_NAME: wbops
      DB_USER: postgres
      DB_PASSWORD: postgres
      BACKUP_DIR: /tmp/wb-insight-backups
      BACKUP_RETENTION_DAYS: 14
      BACKUP_ENCRYPTION_PASSPHRASE_FILE: /tmp/wb-insight-backup-passphrase
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL client
        run: |
          command -v psql
          command -v pg_dump
          command -v pg_restore
          command -v createdb
          command -v dropdb
      - name: Validate shell syntax
        run: bash -n ops/postgres_backup.sh ops/postgres_restore.sh ops/postgres_restore_drill.sh
      - name: Prepare source database
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASSWORD"
          printf '%s\n' 'ci-backup-passphrase-only' > "$BACKUP_ENCRYPTION_PASSPHRASE_FILE"
          chmod 600 "$BACKUP_ENCRYPTION_PASSPHRASE_FILE"
          psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" <<'SQL'
          CREATE TABLE alembic_version (version_num varchar(32) PRIMARY KEY);
          INSERT INTO alembic_version(version_num) VALUES ('ci_restore_revision');
          CREATE TABLE restore_marker (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO restore_marker(id, value) VALUES (1, 'backup-roundtrip-ok');
          SQL
      - name: Create encrypted backup
        id: backup
        run: |
          set -euo pipefail
          output="$(bash ops/postgres_backup.sh)"
          printf '%s\n' "$output"
          backup="$(printf '%s\n' "$output" | sed -n 's/^backup=//p')"
          test -s "$backup"
          test -s "${backup}.sha256"
          test ! -e "${backup%.enc}"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
      - name: Run isolated restore drill
        run: |
          set -euo pipefail
          bash ops/postgres_restore_drill.sh "${{ steps.backup.outputs.backup }}" | tee /tmp/restore-drill.txt
          grep -F 'restore_drill=success' /tmp/restore-drill.txt
          grep -F 'alembic_revision=ci_restore_revision' /tmp/restore-drill.txt
      - name: Verify destructive restore guard
        run: |
          set -euo pipefail
          if bash ops/postgres_restore.sh "${{ steps.backup.outputs.backup }}"; then
            echo 'Restore unexpectedly succeeded without RESTORE_CONFIRM=YES' >&2
            exit 1
          fi
