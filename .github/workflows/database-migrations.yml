name: Database migrations

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'ops/database_upgrade_acceptance.py'
      - '.github/workflows/database-migrations.yml'
  push:
    branches:
      - main
      - p0-production-safety
      - p1-account-scoped-sync
    paths:
      - 'VERSION'
      - 'backend/**'
      - 'ops/database_upgrade_acceptance.py'
      - '.github/workflows/database-migrations.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  alembic-upgrade:
    runs-on: [self-hosted, Linux, X64, wb-ci]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wb_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wb_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: development
      JWT_SECRET_KEY: migration-ci-only-key
      API_TOKEN_ENCRYPTION_KEY: migration-ci-only-encryption-key
      DB_HOST: 127.0.0.1
      DB_PORT: '55432'
      DB_NAME: wb_migration_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Upgrade clean database to Alembic head
        run: alembic upgrade head

      - name: Show current revision
        run: alembic current

      - name: Verify database matches SQLAlchemy metadata
        run: alembic check

      - name: Exercise isolated existing-database upgrade acceptance
        shell: bash
        run: |
          set -euo pipefail
          command -v psql
          command -v pg_dump
          command -v pg_restore
          command -v createdb
          command -v dropdb

          work=/tmp/wb-db-upgrade-ci
          rm -rf "$work"
          mkdir -p "$work"
          printf '%s\n' 'ci-backup-passphrase-only' > "$work/passphrase"
          chmod 600 "$work/passphrase"

          export PGPASSWORD="$DB_PASSWORD"
          pg_dump \
            --format=custom \
            --no-owner \
            --host="$DB_HOST" \
            --port="$DB_PORT" \
            --username="$DB_USER" \
            --dbname="$DB_NAME" \
            --file="$work/source.dump"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass "file:$work/passphrase" \
            -in "$work/source.dump" \
            -out "$work/source.dump.enc"
          rm -f "$work/source.dump"
          (
            cd "$work"
            sha256sum source.dump.enc > source.dump.enc.sha256
          )

          mkdir -p venv/bin
          ln -sf "$(command -v python)" venv/bin/python
          python ../ops/database_upgrade_acceptance.py \
            --project-dir .. \
            --environment ci-db-upgrade \
            --backup "$work/source.dump.enc" \
            --passphrase-file "$work/passphrase" \
            --output "$work/report.json"
          grep -F '"status": "pass"' "$work/report.json"
          grep -F '"alembic_metadata_clean"' "$work/report.json"
          grep -F '"isolated_restore"' "$work/report.json"
