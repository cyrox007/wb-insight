name: Release smoke contract

on:
  pull_request:
    paths:
      - VERSION
      - ops/release_smoke.py
      - ops/systemd_acceptance.py
      - ops/secrets_review.py
      - ops/ux_acceptance.py
      - ops/ci_acceptance.py
      - ops/release_candidate_evidence.py
      - ops/release_evidence.py
      - ops/acceptance/structured_evidence_selftest.py
      - docs/RELEASE_SMOKE.md
      - docs/RELEASE_EVIDENCE.md
      - .github/workflows/release-smoke-contract.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - ops/release_smoke.py
      - ops/systemd_acceptance.py
      - ops/secrets_review.py
      - ops/ux_acceptance.py
      - ops/ci_acceptance.py
      - ops/release_candidate_evidence.py
      - ops/release_evidence.py
      - ops/acceptance/structured_evidence_selftest.py
      - docs/RELEASE_SMOKE.md
      - docs/RELEASE_EVIDENCE.md
      - .github/workflows/release-smoke-contract.yml

jobs:
  smoke-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release acceptance CLIs and secret-safe helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/release_smoke.py \
            ops/systemd_acceptance.py \
            ops/secrets_review.py \
            ops/ux_acceptance.py \
            ops/ci_acceptance.py \
            ops/release_candidate_evidence.py \
            ops/release_evidence.py \
            ops/acceptance/structured_evidence_selftest.py
          python3 ops/release_smoke.py --help >/dev/null
          python3 ops/release_smoke.py --self-test
          python3 ops/systemd_acceptance.py --help >/dev/null
          python3 ops/systemd_acceptance.py --self-test
          python3 ops/secrets_review.py --help >/dev/null
          python3 ops/secrets_review.py --self-test
          python3 ops/ux_acceptance.py --help >/dev/null
          python3 ops/ux_acceptance.py --self-test
          python3 ops/ci_acceptance.py --help >/dev/null
          python3 ops/ci_acceptance.py --self-test
          python3 ops/release_candidate_evidence.py --help >/dev/null
          python3 ops/release_evidence.py --help >/dev/null
          PYTHONPATH=ops python3 ops/acceptance/structured_evidence_selftest.py
