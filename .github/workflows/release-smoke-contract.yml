name: Release smoke contract

on:
  pull_request:
    paths:
      - VERSION
      - ops/release_smoke.py
      - ops/systemd_acceptance.py
      - ops/database_upgrade_acceptance.py
      - ops/payment_acceptance.py
      - ops/backup_restore_acceptance.py
      - ops/wb_live_data_acceptance.py
      - ops/beta_release_evidence.py
      - ops/secrets_review.py
      - ops/ux_acceptance.py
      - ops/ci_acceptance.py
      - ops/release_candidate_evidence.py
      - ops/release_evidence.py
      - ops/acceptance/structured_evidence_selftest.py
      - ops/acceptance/release_candidate_selftest.py
      - ops/acceptance/wb_live_data_selftest.py
      - docs/RELEASE_SMOKE.md
      - docs/RELEASE_EVIDENCE.md
      - docs/DATA_ACCURACY_ACCEPTANCE.md
      - docs/WB_LIVE_DATA_ACCEPTANCE.md
      - .github/workflows/release-smoke-contract.yml
  push:
    branches: [main]
    paths:
      - VERSION
      - ops/release_smoke.py
      - ops/systemd_acceptance.py
      - ops/database_upgrade_acceptance.py
      - ops/payment_acceptance.py
      - ops/backup_restore_acceptance.py
      - ops/wb_live_data_acceptance.py
      - ops/beta_release_evidence.py
      - ops/secrets_review.py
      - ops/ux_acceptance.py
      - ops/ci_acceptance.py
      - ops/release_candidate_evidence.py
      - ops/release_evidence.py
      - ops/acceptance/structured_evidence_selftest.py
      - ops/acceptance/release_candidate_selftest.py
      - ops/acceptance/wb_live_data_selftest.py
      - docs/RELEASE_SMOKE.md
      - docs/RELEASE_EVIDENCE.md
      - docs/DATA_ACCURACY_ACCEPTANCE.md
      - docs/WB_LIVE_DATA_ACCEPTANCE.md
      - .github/workflows/release-smoke-contract.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-contract:
    runs-on: [self-hosted, Linux, X64, wb-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Validate release acceptance CLIs and secret-safe helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/release_smoke.py \
            ops/systemd_acceptance.py \
            ops/database_upgrade_acceptance.py \
            ops/payment_acceptance.py \
            ops/backup_restore_acceptance.py \
            ops/wb_live_data_acceptance.py \
            ops/beta_release_evidence.py \
            ops/secrets_review.py \
            ops/ux_acceptance.py \
            ops/ci_acceptance.py \
            ops/release_candidate_evidence.py \
            ops/release_evidence.py \
            ops/acceptance/structured_evidence_selftest.py \
            ops/acceptance/release_candidate_selftest.py \
            ops/acceptance/wb_live_data_selftest.py
          python3 ops/release_smoke.py --help >/dev/null
          python3 ops/release_smoke.py --self-test
          python3 ops/systemd_acceptance.py --help >/dev/null
          python3 ops/systemd_acceptance.py --self-test
          python3 ops/database_upgrade_acceptance.py --help >/dev/null
          python3 ops/database_upgrade_acceptance.py --self-test
          PYTHONPATH=ops python3 ops/payment_acceptance.py --help >/dev/null
          PYTHONPATH=ops python3 ops/payment_acceptance.py --self-test
          PYTHONPATH=ops python3 ops/backup_restore_acceptance.py --help >/dev/null
          PYTHONPATH=ops python3 ops/backup_restore_acceptance.py --self-test
          PYTHONPATH=ops python3 ops/wb_live_data_acceptance.py --help >/dev/null
          PYTHONPATH=ops python3 ops/wb_live_data_acceptance.py --self-test
          PYTHONPATH=ops python3 ops/beta_release_evidence.py --help >/dev/null
          python3 ops/secrets_review.py --help >/dev/null
          python3 ops/secrets_review.py --self-test
          python3 ops/ux_acceptance.py --help >/dev/null
          python3 ops/ux_acceptance.py --self-test
          python3 ops/ci_acceptance.py --help >/dev/null
          python3 ops/ci_acceptance.py --self-test
          PYTHONPATH=ops python3 ops/release_candidate_evidence.py --help >/dev/null
          python3 ops/release_evidence.py --help >/dev/null
          PYTHONPATH=ops python3 ops/acceptance/structured_evidence_selftest.py
          PYTHONPATH=ops python3 ops/acceptance/release_candidate_selftest.py
          PYTHONPATH=ops python3 ops/acceptance/wb_live_data_selftest.py
