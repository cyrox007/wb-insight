name: Временное обновление lockfile P120

on:
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/package.json'
      - '.github/workflows/p29-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Получить рабочую ветку pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Перегенерировать package-lock штатным npm
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Зафиксировать обновлённый lockfile при наличии изменений
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'package-lock.json уже синхронизирован.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'P120: синхронизировать package-lock после security override'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
