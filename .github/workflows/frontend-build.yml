name: Frontend build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify browser auth is not persisted
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "(localStorage|sessionStorage)\\.(setItem|getItem)\\(['\"](access_token|user)['\"]" src --include='*.js' --include='*.vue'; then
            echo 'Persistent access-token/user storage is forbidden; keep auth identity in memory and restore via HttpOnly refresh cookie.' >&2
            exit 1
          fi
          grep -F "localStorage.removeItem('access_token')" src/security/session.js
          grep -F "sessionStorage.removeItem('access_token')" src/security/session.js

      - name: Build
        run: npm run build
