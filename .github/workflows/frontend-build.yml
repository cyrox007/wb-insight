name: Frontend build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh P29 lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 44
        run: npm update --package-lock-only

      - name: Commit P29 lockfile refresh
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 44
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'package-lock.json already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frontend/package-lock.json
            git commit -m 'P29: regenerate frontend lockfile after security updates'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Verify access credentials are not persisted
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "(localStorage|sessionStorage)\\.(setItem|getItem)\\(['\"]access_token['\"]" src --include='*.js' --include='*.vue'; then
            echo 'Persistent access-token storage is forbidden; keep access JWT in memory and restore via HttpOnly refresh cookie.' >&2
            exit 1
          fi
          grep -F "localStorage.removeItem('access_token')" src/security/session.js
          grep -F "sessionStorage.removeItem('access_token')" src/security/session.js

      - name: Build
        run: npm run build
