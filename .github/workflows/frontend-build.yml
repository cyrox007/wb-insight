name: Frontend build

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - 'VERSION'
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'VERSION'
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Verify access credentials are not persisted
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "(localStorage|sessionStorage)\\.(setItem|getItem)\\(['\"]access_token['\"]" src --include='*.js' --include='*.vue'; then
            echo 'Persistent access-token storage is forbidden; keep access JWT in memory and restore via HttpOnly refresh cookie.' >&2
            exit 1
          fi
          grep -F "localStorage.removeItem('access_token')" src/security/session.js
          grep -F "sessionStorage.removeItem('access_token')" src/security/session.js

      - name: Verify Control Panel API client contracts
        run: npm run check:api-contracts

      - name: Build
        run: npm run build
